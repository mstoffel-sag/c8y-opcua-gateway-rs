[workspace]
resolver = "3"
members = ["crates/gateway", "crates/opcua-conn", "crates/mapping", "crates/tedge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Cumulocity-IoT/c8y-opcua-gateway-rs"

[workspace.dependencies]
async-opcua = { version = "0.19.0", default-features = false }
async-opcua-client = { version = "0.19.0", default-features = false }
async-opcua-types = { version = "0.19.0", default-features = false }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
rumqttc = { version = "0.24", default-features = false }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
toml = "0.9"
figment = { version = "0.10", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
time = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive"] }

opcua-conn = { path = "crates/opcua-conn" }
mapping = { path = "crates/mapping" }
tedge = { path = "crates/tedge" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
